name: build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            artifact: life_worlds-linux
          - name: macOS
            os: macos-latest
            artifact: life_worlds-macos
          - name: Windows
            os: windows-latest
            artifact: life_worlds-windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config \
            libgl1-mesa-dev libx11-dev libxrandr-dev libxi-dev \
            libxcursor-dev libxinerama-dev libxkbcommon-dev \
            libwayland-dev libasound2-dev

      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: ${{ runner.os }}-fetch-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-fetch-

      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Release
          -DLIFE_WORLDS_FETCH_RAYLIB=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Locate binary
        id: binary
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            if [[ -f build/Release/life_worlds.exe ]]; then
              EXE=build/Release/life_worlds.exe
            elif [[ -f build/life_worlds.exe ]]; then
              EXE=build/life_worlds.exe
            else
              echo "life_worlds executable not found under build/"
              find build -name 'life_worlds*' -type f || true
              exit 1
            fi
          else
            EXE=build/life_worlds
            if [[ ! -f "$EXE" ]]; then
              echo "life_worlds executable not found under build/"
              find build -name 'life_worlds*' -type f || true
              exit 1
            fi
          fi
          echo "path=$EXE" >> "$GITHUB_OUTPUT"

      - name: Smoke (console)
        shell: bash
        run: |
          "${{ steps.binary.outputs.path }}" --console --config config/default.json

      - name: Stage artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "${{ steps.binary.outputs.path }}" dist/
          cp config/default.json dist/
          # Optional Q-table if present in the checkout (gitignored locally).
          if [[ -f config/ql_qtable.bin ]]; then
            cp config/ql_qtable.bin dist/
          fi
          ls -la dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
